documents:
  data_dir: datasets
  file_types: ["txt", "pdf", "docx", "csv", "xlsx"]
  encoding: utf-8

chunking:
  strategy: adaptive   # fixed | semantic | adaptive

  fixed:
    chunk_size: 512
    overlap: 50

  semantic:
    max_sentences: 5

  adaptive:
    chunk_size: 512
    overlap: 100

retrieval:
  strategy: hybrid     # dense | bm25 | hybrid
  top_k: 5

  dense:
    embedding_model: sentence-transformers/all-MiniLM-L6-v2
    vector_store: faiss

  hybrid:
    alpha: 0.5

query_optimization:
  strategies:
    - none
    - rewrite
    - multi_query
    - self_reflection

evaluation:
  metrics:
    - answer_relevance
    - context_precision
    - context_recall
    - faithfulness


